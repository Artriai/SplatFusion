[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splatfusion"
version = "0.1.0"
description = "Research scaffold for casual multi-view Gaussian object reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "plyfile>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
splatfusion = "splatfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

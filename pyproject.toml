[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splatfusion"
version = "0.1.0"
description = "Casual multi-view 3D Gaussian object reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.1",
    "plyfile>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
registration = ["open3d>=0.18"]
sam = [
    "torch>=2.0",
    "torchvision>=0.15",
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
]

[project.scripts]
splatfusion = "splatfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
